name: Deploy LiveKit Cloud Agent

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.0.0
    paths:
      - "agent/**"

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    name: Deploy and verify JARVIS agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: jarvis-livekit-agent-deploy
      cancel-in-progress: false
    env:
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      SECRET_LIST: GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate deployment inputs without displaying values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LIVEKIT_URL"
          test -n "$LIVEKIT_API_KEY"
          test -n "$LIVEKIT_API_SECRET"
          test -n "$GOOGLE_API_KEY"
          test -f agent/Dockerfile
      - name: Deploy LiveKit Cloud agent update
        uses: livekit/deploy-action@v2.12.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          OPERATION: deploy
          WORKING_DIRECTORY: agent
      - name: Wait for agent health
        uses: livekit/deploy-action@v2.12.2
        with:
          OPERATION: status-retry
          WORKING_DIRECTORY: agent
          TIMEOUT: 5m
