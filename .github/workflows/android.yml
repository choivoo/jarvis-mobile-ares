name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # AGP 8.x is not compatible with the runner's Gradle 9 default.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Test, lint and build
        run: gradle test lint assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk jarvis-mobile-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-v0.1.0
          path: jarvis-mobile-v0.1.0.apk
      # V0.1 is released from the verified foundation build on main. Later versions
      # will move to version tags once signing-key secrets are configured.
      - name: Publish V0.1 release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: JARVIS Mobile V0.1.0
          body: First verified ARES HUD foundation APK.
          files: jarvis-mobile-v0.1.0.apk
