name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: 1.0.0-rc.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # AGP 8.x is not compatible with the runner's Gradle 9 default.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Test, lint and build
        run: gradle test lint assembleDebug --stacktrace
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk jarvis-mobile-v${VERSION}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-v${{ env.VERSION }}
          path: jarvis-mobile-v${{ env.VERSION }}.apk
      - name: Publish beta release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: JARVIS Mobile V${{ env.VERSION }} Beta
          prerelease: true
          body: Verified beta build. See the release notes for the implemented milestone.
          files: jarvis-mobile-v${{ env.VERSION }}.apk
          generate_release_notes: true
