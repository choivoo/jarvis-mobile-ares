name: Android APK

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Test, lint and verify debug build
        run: gradle test lint assembleDebug --stacktrace
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-v1.0.0-verification
          path: app/build/outputs/apk/debug/app-debug.apk

  official-release:
    if: ${{ github.ref == 'refs/tags/v1.0.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: 1.0.0
      JARVIS_KEYSTORE_PASSWORD: ${{ secrets.JARVIS_KEYSTORE_PASSWORD }}
      JARVIS_KEY_ALIAS: ${{ secrets.JARVIS_KEY_ALIAS }}
      JARVIS_KEY_PASSWORD: ${{ secrets.JARVIS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3

      - name: Validate production signing secrets
        shell: bash
        env:
          JARVIS_KEYSTORE_BASE64: ${{ secrets.JARVIS_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$JARVIS_KEYSTORE_BASE64"
          test -n "$JARVIS_KEYSTORE_PASSWORD"
          test -n "$JARVIS_KEY_ALIAS"
          test -n "$JARVIS_KEY_PASSWORD"
          echo "$JARVIS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jarvis-release.jks"
          test -s "$RUNNER_TEMP/jarvis-release.jks"
          echo "JARVIS_KEYSTORE_PATH=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build signed release
        run: gradle test lint assembleRelease --stacktrace

      - name: Verify signed APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "jarvis-mobile-v${VERSION}.apk"
          sha256sum "jarvis-mobile-v${VERSION}.apk" > "jarvis-mobile-v${VERSION}.apk.sha256"

      - name: Upload official APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-mobile-v${{ env.VERSION }}-official
          path: |
            jarvis-mobile-v${{ env.VERSION }}.apk
            jarvis-mobile-v${{ env.VERSION }}.apk.sha256

      - name: Publish JARVIS Mobile V1.0 Official
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: JARVIS Mobile V1.0.0 Official
          prerelease: false
          make_latest: true
          body: |
            # JARVIS Mobile ARES V1.0.0

            First official release of JARVIS Mobile ARES.

            Core release architecture includes the ARES HUD, Korean voice input pipeline, Korean-to-English translation layer, English assistant response/TTS flow, Korean subtitle overlay, background core, device/weather/search tool routing, and privacy-safe notification/overlay handling.

            This APK is built as a production release and signed with the persistent JARVIS production signing key so future versions can be installed as updates.
          files: |
            jarvis-mobile-v${{ env.VERSION }}.apk
            jarvis-mobile-v${{ env.VERSION }}.apk.sha256
          generate_release_notes: true
