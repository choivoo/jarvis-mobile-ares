name: Deploy JARVIS Token Service

on:
  workflow_dispatch:
  push:
    branches:
      - release/v1.0.0
    paths:
      - ".github/workflows/deploy-token-service.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
      TOKEN_ENDPOINT: https://jarvis-mobile-token.choivoovooge.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            test -n "${!required}"
          done
      - name: Deploy fail-closed token service
        working-directory: backend/cloudflare
        run: npx --yes wrangler@4 deploy
      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --retry 3 --retry-all-errors --max-time 15 "$TOKEN_ENDPOINT/health")"
          test "$response" = '{"service":"jarvis-token-service","status":"ready"}'
      - name: Set Worker server-side LiveKit secrets
        working-directory: backend/cloudflare
        shell: bash
        run: |
          set -euo pipefail
          printf %s "$LIVEKIT_URL" | npx --yes wrangler@4 secret put LIVEKIT_URL
          printf %s "$LIVEKIT_API_KEY" | npx --yes wrangler@4 secret put LIVEKIT_API_KEY
          printf %s "$LIVEKIT_API_SECRET" | npx --yes wrangler@4 secret put LIVEKIT_API_SECRET

# Installation allowlists remain fail-closed until a specific activation ID is enrolled.
# JARVIS_ALLOWED_INSTALLATIONS is deliberately not supplied by CI and is set only after RC install.
